<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>SquareUp | Page Not Found</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
</head>
<body>
<header class="header">
    <div class="header__inner container">
        <a href="./index.html" class="header__logo logo" aria-label="Home" title="Home">
            <img src="./images/logo.svg" alt="" class="logo__image" width="178" height="60">
        </a>
    </div>
</header>
<main>
    <section class="not-found">
        <div class="not-found__inner container">
            <h1 class="not-found__title">404 Oops! Page Not Found</h1>
            <div class="not-found__description">
                <p>
                    Sorry, the page you're looking for doesn't exist or has been moved.
                </p>
            </div>
            <a href="./index.html" class="not-found__button button">
                Back to Home
            </a>
        </div>
    </section>
</main>
</body>
</html>
